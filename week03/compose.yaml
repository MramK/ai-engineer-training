services: 
  api:
    build: .
    container_name: text-api-compose
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: "Text Processing API via Compose"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s